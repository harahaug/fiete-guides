<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Fiete – Mobil</title>
<style>:root{--bg:#f4efe6;--card:#fff;--ink:#17325c;--mut:#6b7a90;--acc:#e2453c;--ok:#1d8a52;--warn:#b36b00}@media(prefers-color-scheme:dark){:root{--bg:#0f1b2d;--card:#18273d;--ink:#eaf1fb;--mut:#9fb0c8}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--ink)}header{padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}nav{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}nav button{flex:0 0 auto;border:0;border-radius:20px;padding:10px 16px;background:var(--card);color:var(--ink);font:inherit;min-height:44px}nav button[aria-current=true]{background:var(--ink);color:var(--bg)}
main{padding:0 12px 40px;max-width:760px;margin:auto}.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0002}.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:12px;background:#0002;margin:0 4px 4px 0}.ok{color:var(--ok)}.warn{color:var(--warn)}.mut{color:var(--mut);font-size:14px}
img{max-width:100%;border-radius:10px;margin:4px 4px 4px 0;height:190px}pre{white-space:pre-wrap;font:14px system-ui;background:#0001;padding:10px;border-radius:10px}a{color:var(--acc)}form{max-width:340px;margin:20vh auto;padding:0 16px}input,button.go{width:100%;font:inherit;padding:14px;border-radius:12px;border:1px solid #0003;margin-top:10px}button.go{background:var(--ink);color:var(--bg);border:0}.day{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.day b{min-width:78px}h2{font-size:17px;margin:18px 4px 4px}</style></head><body>
<div id="app"><form id="f"><h2>Fiete – Kommandozentrale (mobil)</h2><input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password" autofocus><button class="go">Öffnen</button><p class="mut" id="msg"></p></form></div>
<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)), $ = s => document.querySelector(s);
async function decrypt(pass, d) { const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']), key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(d.salt), iterations: d.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(d.iv) }, key, b64(d.ct)))); }
const h = (t, a = {}, ...k) => { const e = document.createElement(t); for (const [x, v] of Object.entries(a)) x === 'class' ? e.className = v : e.setAttribute(x, v); for (const c of k.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); return e; };
const SD = { planned: 'wird gebaut', built: 'bereit', published: 'veröffentlicht', stopped: 'gestoppt', failed: 'Fehler' }, FMT = { reel: 'Reel', carousel: 'Karussell', post: 'Post', story: 'Story' };
function item(D, it) { return h('div', { class: 'card' }, h('div', {}, h('span', { class: 'chip' }, `#${it.id}`), h('span', { class: 'chip ' + (it.status === 'built' ? 'warn' : it.status === 'published' ? 'ok' : '') }, SD[it.status] ?? it.status), h('b', {}, ` ${it.art} · ${it.due}`)), h('div', { class: 'mut' }, it.title), it.anlass ? h('div', { class: 'chip warn' }, '★ ' + it.anlass) : null,
  h('div', {}, it.files.map(f => D.images[f] ? h('img', { src: D.images[f], alt: '' }) : null)), it.pdf ? h('div', {}, h('a', { href: it.pdf, target: '_blank', rel: 'noopener' }, 'Guide-PDF öffnen')) : null, it.caption ? h('pre', {}, it.caption) : null, it.status !== 'published' ? h('div', { class: 'mut' }, `Befehle: stop ${it.id} · neu ${it.id} · weiter ${it.id}`) : null); }
const VIEWS = {
  Kalender: D => D.kalender.days.map(d => h('div', { class: 'card' }, h('div', { class: 'day' }, h('b', {}, `${d.wochentag} ${d.date.slice(8)}.${d.date.slice(5, 7)}.`), (d.formate ?? []).map(f => h('span', { class: 'chip' }, FMT[f] ?? f)), d.heute ? h('span', { class: 'chip warn' }, 'heute') : null), d.anlaesse.length ? h('div', { class: 'mut' }, '★ ' + d.anlaesse.slice(0, 2).join(' · ')) : null, d.topic_vorschlag ? h('div', { class: 'mut' }, 'Thema (Vorschlag): ' + d.topic_vorschlag) : null, d.reels.map(r => h('div', {}, h('span', { class: 'chip ok' }, 'Reel'), r.title, ' · ', r.status_de)), d.items.map(i => h('div', {}, h('span', { class: 'chip' }, i.art), SD[i.status] ?? i.status)), (d.geplant ?? []).map(g => h('div', { class: 'mut' }, `geplant: ${g.kind} – ${g.thema}`)))),
  Vorschau: D => [D.plan.reels.map(r => h('div', { class: 'card' }, h('b', {}, 'Reel: ' + r.title), h('div', { class: 'mut' }, `${r.id} · fällig ${r.due} · ${r.status_de}`), r.caption ? h('pre', {}, r.caption) : null, h('div', { class: 'mut' }, `Befehle: veto ${r.id}`))), D.plan.items.map(i => item(D, i))],
  Performance: D => h('div', { class: 'card' }, h('div', {}, `Veröffentlichte Reels: ${D.performance.summe.reels}`), h('div', {}, `Follower: ${D.performance.konto.followers ?? 'n. v.'}`), h('div', {}, `Reichweite (Median): ${D.performance.summe.reach_median ?? 'n. v.'}`), D.performance.hinweis ? h('div', { class: 'mut' }, D.performance.hinweis) : null, D.performance.reels.map(r => h('div', { class: 'mut' }, `${r.title}: Views ${r.views ?? 'n. v.'} · Reichweite ${r.reach ?? 'n. v.'} · Gespeichert ${r.saved ?? 'n. v.'}`))),
  Steuern: D => h('div', { class: 'card' }, h('p', {}, 'Befehle schreibst du als Kommentar in das Vorschau-Issue (GitHub-App) oder an den Telegram-Bot.'), D.issue ? h('p', {}, h('a', { href: D.issue, target: '_blank', rel: 'noopener' }, 'Vorschau-Issue öffnen')) : null, h('pre', {}, 'stop 12\nweiter 12\nneu 12\nveto reel-…\nfreigeben reel-…\nproduzieren · plan · veröffentlichen · status')) };
function show(D) { const app = $('#app'), render = n => { main.replaceChildren(...[].concat(VIEWS[n](D)).flat().filter(Boolean)); for (const b of nav.children) b.setAttribute('aria-current', b.textContent === n); }, main = h('main'), nav = h('nav', {}, Object.keys(VIEWS).map(n => h('button', { type: 'button', onclick: () => render(n) }, n)));
  app.replaceChildren(h('header', {}, h('span', {}, 'Fiete ⚓'), h('span', { class: 'mut' }, 'Stand ' + new Date(D.stand).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }))), nav, main); render('Vorschau'); }
async function open(pass) { const r = await fetch('data.json', { cache: 'no-store' }); show(await decrypt(pass, await r.json())); }
$('#f').addEventListener('submit', async e => { e.preventDefault(); const p = $('#pw').value; try { await open(p); try { localStorage.setItem('fp', p); } catch {} } catch { $('#msg').textContent = 'Falsche Passphrase oder keine Daten.'; } });
try { const s = localStorage.getItem('fp'); if (s) open(s).catch(() => {}); } catch {}
</script></body></html>
